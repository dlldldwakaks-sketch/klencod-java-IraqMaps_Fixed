name: Build Iraq Maps APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repository contains the Dart source files, not the generated
      # Android/Gradle wrapper files. Generate those files in CI.
      - name: Generate Android project
        run: flutter create --platforms=android --project-name iraq_maps .

      - name: Restore app source files and configure package ID
        shell: bash
        run: |
          git checkout -- pubspec.yaml lib/main.dart android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/^    namespace = .*/    namespace = "com.mymap.iraq"/' android/app/build.gradle.kts
            sed -i 's/^        applicationId = .*/        applicationId = "com.mymap.iraq"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/^    namespace .*/    namespace "com.mymap.iraq"/' android/app/build.gradle
            sed -i 's/^        applicationId .*/        applicationId "com.mymap.iraq"/' android/app/build.gradle
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iraq-maps-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
