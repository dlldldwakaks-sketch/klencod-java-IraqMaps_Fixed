name: Build Android Java APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klencod-java-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/klencod-gradle.log"

          if [ -f gradlew ]; then
            echo "✅ Using Gradle Wrapper (gradlew)"
            chmod +x gradlew || true
            ./gradlew --no-daemon --build-cache --parallel \
              :app:assembleDebug -x lint -x test 2>&1 | tee "$LOG"
          else
            echo "⚠️ gradlew غير موجود — استخدام gradle من النظام"
            echo "ℹ️ هذا شائع في المشاريع المستوردة من الخارج"
            gradle --no-daemon --build-cache --parallel \
              :app:assembleDebug -x lint -x test 2>&1 | tee "$LOG"
          fi

      - name: Print compiler diagnostics on failure
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/klencod-gradle.log"
          echo "===== Klencod compiler diagnostics ====="
          if [[ -f "$LOG" ]]; then
            grep -E 'error:|warning:|FAILED|Compilation failed|BUILD FAILED|What went wrong' "$LOG" | tail -n 120 || true
          else
            echo "Gradle output file was not created."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: klencod-java-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
